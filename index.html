<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Claude 스킬·MCP 모음</title>
<meta name="description" content="Claude에서 쓸 만한 GitHub 스킬·MCP 저장소를 별 개수 순으로 모은 목록">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 레이아웃: 상단 요약 + 검색·필터 바(고정) + 별 개수 순 한 줄 목록 */
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --fg:#151A22; --muted:#5A6372; --line:#E0E4EA;
  --accent:#B86E00; --accent-soft:#FFF1D9; --link:#1D5BBF; --chip:#EEF1F5; --chip-on:#151A22; --chip-on-fg:#FFFFFF;
  --ok:#1E7F4F;
  --font-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1217; --surface:#161B22; --fg:#E7EBF1; --muted:#8C96A6; --line:#252C37;
  --accent:#F2B33D; --accent-soft:#2D2412; --link:#86B4FF; --chip:#1D232C; --chip-on:#E7EBF1; --chip-on-fg:#0F1217;
  --ok:#5BC98E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1217; --surface:#161B22; --fg:#E7EBF1; --muted:#8C96A6; --line:#252C37;
  --accent:#F2B33D; --accent-soft:#2D2412; --link:#86B4FF; --chip:#1D232C; --chip-on:#E7EBF1; --chip-on-fg:#0F1217;
  --ok:#5BC98E; color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--font-body);-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{padding-block:40px 20px}
h1{margin:0 0 6px;font-size:clamp(24px,4vw,32px);font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.lede{margin:0;color:var(--muted);max-width:62ch}
.meta{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px 18px;font-family:var(--font-mono);font-size:12.5px;color:var(--muted)}
.meta b{color:var(--fg);font-weight:600}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:12px}
.bar .wrap{display:flex;flex-direction:column;gap:10px}
#q{width:100%;padding:11px 14px;font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px}
#q:focus{outline:2px solid var(--link);outline-offset:1px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;cursor:pointer;font:inherit;font-size:13.5px;padding:6px 12px;border-radius:999px;background:var(--chip);color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-fg)}
.chip .n{font-family:var(--font-mono);font-size:11.5px;opacity:.7;margin-left:4px}
.chip:focus-visible,.copy:focus-visible,a:focus-visible{outline:2px solid var(--link);outline-offset:2px}
main{padding-block:8px 48px}
ol{list-style:none;margin:0;padding:0}
li.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto auto;align-items:center;gap:6px 16px;padding:14px 4px;border-bottom:1px solid var(--line)}
.rank{font-family:var(--font-mono);font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.main{min-width:0}
.name{font-family:var(--font-mono);font-weight:600;font-size:14.5px;color:var(--link);text-decoration:none;word-break:break-all}
.name:hover{text-decoration:underline}
.name .owner{font-weight:400;opacity:.75}
.desc{margin:3px 0 0;color:var(--fg);font-size:14px}
.tags{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;padding:1px 8px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
.tag.design{border-color:transparent;background:var(--accent-soft);color:var(--accent)}
.stars{font-family:var(--font-mono);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;min-width:88px}
.stars::before{content:"★ ";color:var(--accent)}
.copy{cursor:pointer;font:inherit;font-size:13px;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);white-space:nowrap;min-width:64px}
.copy:hover{border-color:var(--muted)}
.copy.done{color:var(--ok);border-color:var(--ok)}
.empty{padding:40px 4px;color:var(--muted)}
footer{padding-block:0 40px;color:var(--muted);font-size:12.5px}
@media (max-width:560px){
  li.row{grid-template-columns:28px minmax(0,1fr) auto;grid-template-areas:"r m m" ". s c"}
  .rank{grid-area:r;align-self:start;padding-top:2px}
  .main{grid-area:m}
  .stars{grid-area:s;text-align:left;min-width:0}
  .copy{grid-area:c}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="wrap">
  <h1>Claude 스킬·MCP 모음</h1>
  <p class="lede">Claude에서 쓸 만한 GitHub 스킬·MCP·플러그인 저장소를 별 개수 순으로 모았어요. 이름을 누르면 저장소가 새 탭에서 열리고, 복사 버튼을 누르면 링크가 복사됩니다.</p>
  <div class="meta" id="meta"><span>불러오는 중…</span></div>
</header>
<div class="bar">
  <div class="wrap">
    <input id="q" type="search" placeholder="이름·설명·분류로 검색 (예: figma, 메모리, 브라우저)" autocomplete="off" aria-label="검색">
    <div class="chips" id="chips" role="group" aria-label="유형 필터"></div>
  </div>
</div>
<main class="wrap">
  <ol id="list"></ol>
  <p class="empty" id="empty" hidden>조건에 맞는 저장소가 없어요. 검색어를 바꾸거나 필터를 '전체'로 바꿔 보세요.</p>
</main>
<footer class="wrap">별 개수는 매일 GitHub에서 다시 가져와 갱신됩니다.</footer>
<script>
const FILTERS=[
  {id:"all",label:"전체",test:()=>true},
  {id:"design",label:"웹디자인",test:i=>i.category.includes("웹디자인")},
  {id:"mcp",label:"MCP",test:i=>i.type.includes("MCP")},
  {id:"skill",label:"스킬",test:i=>i.type.includes("스킬")},
  {id:"plugin",label:"플러그인",test:i=>i.type.includes("플러그인")},
  {id:"tool",label:"도구",test:i=>i.type.includes("도구")||i.type.includes("라이브러리")},
  {id:"list",label:"모음집",test:i=>i.type.includes("모음집")},
  {id:"dev",label:"SDK·가이드",test:i=>/SDK|가이드|문서/.test(i.type)}
];
let items=[],active="all",query="";
const $=s=>document.querySelector(s);
const fmt=n=>n.toLocaleString("ko-KR");
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

async function copyText(text,btn){
  let ok=false;
  try{await navigator.clipboard.writeText(text);ok=true}catch(e){}
  if(!ok){
    const ta=document.createElement("textarea");ta.value=text;ta.setAttribute("readonly","");
    ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();
    try{ok=document.execCommand("copy")}catch(e){}
    ta.remove();
  }
  btn.textContent=ok?"복사됨":"복사 실패";btn.classList.toggle("done",ok);
  clearTimeout(btn._t);btn._t=setTimeout(()=>{btn.textContent="복사";btn.classList.remove("done")},1400);
}

function renderChips(){
  $("#chips").innerHTML=FILTERS.map(f=>{
    const n=items.filter(f.test).length;
    return `<button class="chip" type="button" data-id="${f.id}" aria-pressed="${f.id===active}">${f.label}<span class="n">${n}</span></button>`;
  }).join("");
}

function render(){
  const f=FILTERS.find(x=>x.id===active);
  const q=query.trim().toLowerCase();
  const shown=items.filter(i=>f.test(i)&&(!q||(i.name+" "+i.desc+" "+i.category+" "+i.type).toLowerCase().includes(q)));
  $("#list").innerHTML=shown.map(i=>{
    const url="https://github.com/"+i.name;
    const [owner,repo]=i.name.split("/");
    const cats=i.category.split("·").map(c=>`<span class="tag${c==="웹디자인"?" design":""}">${esc(c)}</span>`).join("");
    return `<li class="row">
      <span class="rank">${i.rank}</span>
      <div class="main">
        <a class="name" href="${url}" target="_blank" rel="noopener"><span class="owner">${esc(owner)}/</span>${esc(repo)}</a>
        <p class="desc">${esc(i.desc)}</p>
        <div class="tags"><span class="tag">${esc(i.type)}</span>${cats}</div>
      </div>
      <span class="stars">${fmt(i.stars)}</span>
      <button class="copy" type="button" data-url="${url}" aria-label="${esc(i.name)} 링크 복사">복사</button>
    </li>`;
  }).join("");
  $("#empty").hidden=shown.length>0;
}

$("#chips").addEventListener("click",e=>{
  const b=e.target.closest(".chip");if(!b)return;
  active=b.dataset.id;renderChips();render();
});
$("#list").addEventListener("click",e=>{
  const b=e.target.closest(".copy");if(b)copyText(b.dataset.url,b);
});
$("#q").addEventListener("input",e=>{query=e.target.value;render()});

fetch("data.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{
  items=d.items.slice().sort((a,b)=>b.stars-a.stars);
  items.forEach((it,k)=>it.rank=k+1);
  $("#meta").innerHTML=`<span>저장소 <b>${items.length}</b>개</span><span>별 <b>${fmt(d.minStars)}</b>개 이상</span><span>업데이트 <b>${esc(d.updated)}</b></span>`;
  renderChips();render();
}).catch(()=>{
  $("#meta").innerHTML="<span>목록을 불러오지 못했어요. 새로고침해 보세요.</span>";
});
</script>
</body>
</html>
