<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Claude 스킬·MCP 모음</title>
<meta name="description" content="Claude에서 쓸 만한 GitHub 스킬·MCP·플러그인 저장소를 별 개수 순으로 모은 목록">
<meta name="theme-color" content="#0F172A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
/* 디자인 시스템: ui-ux-pro-max "Dark Mode (OLED)" + 개발자 도구 타이포 (JetBrains Mono / IBM Plex Sans)
   레이아웃: 검색 중심 히어로 → 분류 타일 → 고정 검색바 + 저장소 카드 목록 */
:root{
  --bg:#0B1120; --bg-2:#0F172A; --card:#1B2336; --card-hover:#222C42; --muted:#272F42;
  --fg:#F8FAFC; --fg-2:#CBD5E1; --fg-muted:#94A3B8; --border:#334155; --border-strong:#475569;
  --accent:#22C55E; --accent-ink:#0F172A; --accent-soft:rgba(34,197,94,.12);
  --star:#FBBF24; --link:#7DD3FC; --design:#C084FC; --design-soft:rgba(192,132,252,.14);
  --ring:#FFFFFF;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --font-body:"IBM Plex Sans KR","IBM Plex Sans",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --r-sm:8px; --r-md:12px; --r-lg:16px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:48px;
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 var(--font-body);-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* 히어로 */
.hero{position:relative;padding-block:var(--sp-7) var(--sp-5);overflow:hidden}
.hero::after{content:"";position:absolute;inset:-40% -10% auto;height:120%;background:radial-gradient(60% 50% at 50% 0%,rgba(34,197,94,.10),transparent 70%);pointer-events:none}
.hero .wrap{position:relative;z-index:1}
.prompt{font-family:var(--font-mono);font-size:13px;color:var(--accent);letter-spacing:.02em;margin:0 0 var(--sp-3)}
.prompt span{color:var(--fg-muted)}
h1{margin:0;font-family:var(--font-mono);font-weight:700;font-size:clamp(28px,5vw,44px);line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
h1 em{font-style:normal;color:var(--accent);text-shadow:0 0 18px rgba(34,197,94,.35)}
.lede{margin:var(--sp-3) 0 0;color:var(--fg-2);max-width:60ch;font-size:16px}
.stats{margin-top:var(--sp-5);display:flex;flex-wrap:wrap;gap:var(--sp-2) var(--sp-5);font-family:var(--font-mono);font-size:13px;color:var(--fg-muted)}
.stats b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}

/* 분류 타일 */
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--sp-3);padding-block:var(--sp-3) var(--sp-5)}
.cat{display:flex;align-items:center;gap:var(--sp-3);min-height:64px;padding:var(--sp-3) var(--sp-4);background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);color:var(--fg);font:inherit;text-align:left;cursor:pointer;transition:border-color .18s var(--ease),background-color .18s var(--ease),transform .18s var(--ease)}
.cat:hover{background:var(--card-hover);border-color:var(--border-strong)}
.cat[aria-pressed="true"]{border-color:var(--accent);background:linear-gradient(0deg,var(--accent-soft),var(--accent-soft)),var(--card)}
.cat .ic{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--muted);color:var(--fg-2)}
.cat[aria-pressed="true"] .ic{background:var(--accent);color:var(--accent-ink)}
.cat .t{display:flex;flex-direction:column;min-width:0}
.cat .l{font-weight:600;font-size:15px}
.cat .n{font-family:var(--font-mono);font-size:12px;color:var(--fg-muted);font-variant-numeric:tabular-nums}

/* 고정 검색바 */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:rgba(11,17,32,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding-block:var(--sp-3)}
.bar .wrap{display:flex;flex-direction:column;gap:var(--sp-2)}
.search{position:relative}
.search label{display:block;font-size:13px;color:var(--fg-muted);margin-bottom:6px}
.search .field{position:relative}
.search svg.i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--fg-muted);pointer-events:none}
#q{width:100%;min-height:48px;padding:12px 44px 12px 42px;font:inherit;font-size:16px;color:var(--fg);background:var(--bg-2);border:1px solid var(--border-strong);border-radius:var(--r-md);transition:border-color .18s var(--ease)}
#q::placeholder{color:#64748B}
#q:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
#clear{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;display:grid;place-items:center;border:0;border-radius:var(--r-sm);background:transparent;color:var(--fg-muted);cursor:pointer}
#clear:hover{color:var(--fg);background:var(--muted)}
.result-line{font-family:var(--font-mono);font-size:12.5px;color:var(--fg-muted)}
.result-line b{color:var(--fg)}

/* 목록 */
main{padding-block:var(--sp-4) var(--sp-7)}
ol{list-style:none;margin:0;padding:0;display:grid;gap:var(--sp-2)}
.repo{display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:center;gap:var(--sp-3) var(--sp-4);padding:var(--sp-4);background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);transition:border-color .18s var(--ease),background-color .18s var(--ease)}
.repo:hover{border-color:var(--border-strong);background:var(--card-hover)}
.rank{font-family:var(--font-mono);font-weight:600;font-size:15px;color:var(--fg-muted);text-align:center;font-variant-numeric:tabular-nums}
.repo.top .rank{color:var(--star)}
.body{min-width:0}
.name{display:inline-flex;align-items:center;gap:6px;max-width:100%;font-family:var(--font-mono);font-weight:600;font-size:15px;color:var(--link);text-decoration:none;border-radius:4px;cursor:pointer}
.name span{overflow-wrap:anywhere}
.name .own{font-weight:400;color:var(--fg-muted)}
.name svg.i{width:14px;height:14px;opacity:.7}
.name:hover{text-decoration:underline;text-underline-offset:3px}
.desc{margin:4px 0 0;color:var(--fg-2);font-size:14.5px}
.tags{margin-top:var(--sp-2);display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;line-height:1.6;padding:1px 8px;border-radius:999px;border:1px solid var(--border);color:var(--fg-muted)}
.tag.type{font-family:var(--font-mono);font-size:11.5px}
.tag.design{border-color:transparent;background:var(--design-soft);color:var(--design)}
.side{display:flex;align-items:center;gap:var(--sp-3)}
.stars{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:14px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:92px;justify-content:flex-end}
.stars svg.i{width:16px;height:16px;fill:var(--star);stroke:var(--star)}
.copy{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;min-width:44px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--border-strong);background:var(--bg-2);color:var(--fg);font:inherit;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;transition:border-color .15s var(--ease),background-color .15s var(--ease),color .15s var(--ease)}
.copy:hover{border-color:var(--accent);color:var(--accent)}
.copy:active{transform:scale(.97)}
.copy.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.copy svg.i{width:16px;height:16px}

.empty{padding:var(--sp-7) var(--sp-4);text-align:center;color:var(--fg-2);background:var(--card);border:1px dashed var(--border-strong);border-radius:var(--r-md)}
.empty p{margin:0 0 var(--sp-3)}
.empty .sugg{display:flex;flex-wrap:wrap;gap:var(--sp-2);justify-content:center}
.empty button{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--border-strong);background:var(--bg-2);color:var(--fg);font:inherit;font-size:14px;cursor:pointer}
.empty button:hover{border-color:var(--accent);color:var(--accent)}

footer{padding-block:0 var(--sp-7);color:var(--fg-muted);font-size:13px}
footer a{color:var(--fg-2)}

/* 토스트 */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;display:flex;align-items:center;gap:8px;max-width:calc(100% - 32px);padding:12px 16px;border-radius:var(--r-md);background:var(--fg);color:var(--bg-2);font-size:14px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.45);pointer-events:none;transition:opacity .2s var(--ease),transform .2s var(--ease);z-index:30}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast code{font-family:var(--font-mono);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw}
.toast svg.i{color:#16A34A}

:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.cat:focus-visible,.copy:focus-visible{outline-offset:3px}

@media (max-width:820px){.cats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){
  .hero{padding-block:var(--sp-6) var(--sp-4)}
  .repo{grid-template-columns:32px minmax(0,1fr);grid-template-areas:"r b" ". s";padding:var(--sp-3)}
  .rank{grid-area:r;align-self:start;padding-top:2px;font-size:13px}
  .body{grid-area:b}
  .side{grid-area:s;justify-content:space-between}
  .stars{justify-content:flex-start;min-width:0}
  .cat{min-height:56px;padding:var(--sp-2) var(--sp-3)}
}
@media (prefers-reduced-motion:no-preference){
  .hero .wrap{animation:rise .4s var(--ease) both}
  @keyframes rise{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 2.5 2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-ext" viewBox="0 0 24 24"><path d="M14 4h6v6M10 14 20 4M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
  <symbol id="i-palette" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.7-.9 1.4-1.8-.4-1.1.3-2.2 1.5-2.2H17a4 4 0 0 0 4-4c0-5.5-4-10-9-10z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10.5" cy="7" r="1"/><circle cx="15" cy="7.5" r="1"/></symbol>
  <symbol id="i-plug" viewBox="0 0 24 24"><path d="M9 2v6M15 2v6M6 8h12v4a6 6 0 0 1-12 0zM12 18v4"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M5.6 18.4l2.8-2.8M15.6 8.4l2.8-2.8"/></symbol>
  <symbol id="i-puzzle" viewBox="0 0 24 24"><path d="M10 4a2 2 0 1 1 4 0v2h4v4h-2a2 2 0 1 0 0 4h2v4h-4v-2a2 2 0 1 0-4 0v2H6v-4h2a2 2 0 1 0 0-4H6V6h4z"/></symbol>
  <symbol id="i-tool" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></symbol>
</svg>

<header class="hero">
  <div class="wrap">
    <p class="prompt">$ <span>claude</span> --list skills mcp --sort stars</p>
    <h1>Claude 스킬·<em>MCP</em> 모음</h1>
    <p class="lede">Claude에서 쓸 만한 GitHub 스킬·MCP·플러그인 저장소를 별 개수 순으로 모았어요. 이름을 누르면 저장소가 바로 열리고, 복사 버튼을 누르면 링크가 복사됩니다.</p>
    <div class="stats" id="stats"><span>불러오는 중…</span></div>
  </div>
</header>

<section class="wrap" aria-label="분류">
  <div class="cats" id="cats"></div>
</section>

<div class="bar">
  <div class="wrap">
    <div class="search">
      <label for="q" class="sr">저장소 검색</label>
      <div class="field">
        <svg class="i" aria-hidden="true"><use href="#i-search"/></svg>
        <input id="q" type="search" placeholder="이름·설명·분류 검색 (예: figma, 메모리, 브라우저)" autocomplete="off" enterkeyhint="search">
        <button id="clear" type="button" aria-label="검색어 지우기" hidden><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button>
      </div>
    </div>
    <div class="result-line" id="resultLine" aria-live="polite"></div>
  </div>
</div>

<main class="wrap">
  <ol id="list"></ol>
  <div class="empty" id="empty" hidden>
    <p id="emptyMsg">조건에 맞는 저장소가 없어요.</p>
    <div class="sugg" id="sugg"></div>
  </div>
</main>

<footer class="wrap">별 개수는 매일 아침 GitHub에서 다시 가져와 갱신됩니다. 디자인 가이드: <a href="https://github.com/nextlevelbuilder/ui-ux-pro-max-skill" target="_blank" rel="noopener">ui-ux-pro-max-skill</a></footer>

<div class="toast" id="toast" role="status" aria-live="polite"><svg class="i" aria-hidden="true"><use href="#i-check"/></svg><span>링크 복사됨</span><code id="toastUrl"></code></div>

<script>
const FILTERS=[
  {id:"all",label:"전체",icon:"i-grid",test:()=>true},
  {id:"design",label:"웹디자인",icon:"i-palette",test:i=>i.category.includes("웹디자인")},
  {id:"mcp",label:"MCP",icon:"i-plug",test:i=>i.type.includes("MCP")},
  {id:"skill",label:"스킬",icon:"i-spark",test:i=>i.type.includes("스킬")},
  {id:"plugin",label:"플러그인",icon:"i-puzzle",test:i=>i.type.includes("플러그인")},
  {id:"tool",label:"도구",icon:"i-tool",test:i=>i.type.includes("도구")||i.type.includes("라이브러리")},
  {id:"list",label:"모음집",icon:"i-list",test:i=>i.type.includes("모음집")},
  {id:"dev",label:"SDK·가이드",icon:"i-book",test:i=>/SDK|가이드|문서/.test(i.type)}
];
const SUGGEST=["figma","메모리","브라우저","디자인","토큰 절약","공식"];
let items=[],active="all",query="";
const $=s=>document.querySelector(s);
const fmt=n=>n.toLocaleString("ko-KR");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const icon=(id,cls="i")=>`<svg class="${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;

let toastTimer;
function toast(url){
  $("#toastUrl").textContent=url.replace("https://","");
  const t=$("#toast");t.classList.add("show");
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),3000);
}
async function copyText(text,btn){
  let ok=false;
  try{await navigator.clipboard.writeText(text);ok=true}catch(e){}
  if(!ok){
    const ta=document.createElement("textarea");ta.value=text;ta.setAttribute("readonly","");
    ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();
    try{ok=document.execCommand("copy")}catch(e){}
    ta.remove();
  }
  const label=btn.querySelector("span");
  if(ok){
    btn.classList.add("done");btn.querySelector("use").setAttribute("href","#i-check");label.textContent="복사됨";toast(text);
  }else{label.textContent="복사 실패"}
  clearTimeout(btn._t);
  btn._t=setTimeout(()=>{btn.classList.remove("done");btn.querySelector("use").setAttribute("href","#i-copy");label.textContent="복사"},1600);
}

function renderCats(){
  $("#cats").innerHTML=FILTERS.map(f=>{
    const n=items.filter(f.test).length;
    return `<button class="cat" type="button" data-id="${f.id}" aria-pressed="${f.id===active}">
      <span class="ic">${icon(f.icon)}</span>
      <span class="t"><span class="l">${f.label}</span><span class="n">${n}개</span></span>
    </button>`;
  }).join("");
}

function render(){
  const f=FILTERS.find(x=>x.id===active);
  const q=query.trim().toLowerCase();
  const shown=items.filter(i=>f.test(i)&&(!q||(i.name+" "+i.desc+" "+i.category+" "+i.type).toLowerCase().includes(q)));
  $("#list").innerHTML=shown.map(i=>{
    const url="https://github.com/"+i.name;
    const [owner,repo]=i.name.split("/");
    const cats=i.category.split("·").map(c=>`<span class="tag${c==="웹디자인"?" design":""}">${esc(c)}</span>`).join("");
    return `<li class="repo${i.rank<=3?" top":""}">
      <span class="rank" aria-label="${i.rank}위">${i.rank}</span>
      <div class="body">
        <a class="name" href="${url}" target="_blank" rel="noopener"><span><span class="own">${esc(owner)}/</span>${esc(repo)}</span>${icon("i-ext")}</a>
        <p class="desc">${esc(i.desc)}</p>
        <div class="tags"><span class="tag type">${esc(i.type)}</span>${cats}</div>
      </div>
      <div class="side">
        <span class="stars" aria-label="별 ${fmt(i.stars)}개">${icon("i-star")}${fmt(i.stars)}</span>
        <button class="copy" type="button" data-url="${url}" aria-label="${esc(i.name)} 링크 복사">${icon("i-copy")}<span>복사</span></button>
      </div>
    </li>`;
  }).join("");
  const label=f.id==="all"?"전체":f.label;
  $("#resultLine").innerHTML=`<b>${shown.length}</b>개 표시 · ${esc(label)}${q?` · "${esc(query.trim())}"`:""}`;
  const empty=shown.length===0;
  $("#empty").hidden=!empty;
  if(empty){
    $("#emptyMsg").textContent=q?`"${query.trim()}"에 맞는 저장소가 ${label==="전체"?"":label+"에서 "}없어요. 이런 검색어는 어때요?`:"이 분류에는 저장소가 없어요.";
    const sugg=SUGGEST.filter(s=>s!==q).slice(0,5).map(s=>`<button type="button" data-s="${esc(s)}">${esc(s)}</button>`);
    if(active!=="all")sugg.unshift(`<button type="button" data-all="1">전체에서 찾기</button>`);
    $("#sugg").innerHTML=sugg.join("");
  }
}

function setQuery(v){query=v;$("#q").value=v;$("#clear").hidden=!v;render()}

$("#cats").addEventListener("click",e=>{
  const b=e.target.closest(".cat");if(!b)return;
  active=b.dataset.id;renderCats();render();
  $(".bar").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
});
$("#list").addEventListener("click",e=>{const b=e.target.closest(".copy");if(b)copyText(b.dataset.url,b)});
$("#q").addEventListener("input",e=>{query=e.target.value;$("#clear").hidden=!query;render()});
$("#clear").addEventListener("click",()=>{setQuery("");$("#q").focus()});
$("#sugg").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.all){active="all";renderCats();render()}else setQuery(b.dataset.s);
});
document.addEventListener("keydown",e=>{
  if(e.key==="/"&&document.activeElement!==$("#q")){e.preventDefault();$("#q").focus()}
});

fetch("data.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{
  items=d.items.slice().sort((a,b)=>b.stars-a.stars);
  items.forEach((it,k)=>it.rank=k+1);
  $("#stats").innerHTML=`<span>저장소 <b>${items.length}</b>개</span><span>별 <b>${fmt(d.minStars)}</b>개 이상만</span><span>업데이트 <b>${esc(d.updated)}</b></span><span>검색 단축키 <b>/</b></span>`;
  renderCats();render();
}).catch(()=>{
  $("#stats").innerHTML="<span>목록을 불러오지 못했어요. 페이지를 새로고침해 주세요.</span>";
});
</script>
</body>
</html>
